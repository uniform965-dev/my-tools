<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Tools</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="app">

    <header class="header">

      <h1>
        My Tools
      </h1>

      <p>
        個人工具庫
      </p>

    </header>


    <main>

      <!-- 登入區 -->

      <section
        id="loginPanel"
        class="tool-card"
      >

        <div class="tool-title">
          🔐 工具登入
        </div>

        <p>
          請輸入存取密碼
        </p>

        <input
          id="passwordInput"
          type="password"
          placeholder="存取密碼"
          autocomplete="current-password"
        >

        <button
          id="loginButton"
          class="start-button"
        >
          進入工具
        </button>

        <div
          id="loginMessage"
          class="status"
        >
        </div>

      </section>


      <!-- 翻譯工具 -->

      <section
        id="translatorPanel"
        class="tool-card"
        style="display:none;"
      >


        <div class="tool-title">
          🎙 即時語音翻譯
        </div>


        <div
          id="status"
          class="status"
        >
          尚未開始
        </div>


        <!-- 翻譯模式 -->

        <div class="translation-mode">

          <div class="panel-label">
            翻譯模式
          </div>


          <label class="mode-option">

            <input
              type="radio"
              name="translationMode"
              value="instant"
              checked
            >

            即時翻譯

          </label>


          <label class="mode-option">

            <input
              type="radio"
              name="translationMode"
              value="buffer"
            >

            累積字數後翻譯

          </label>


          <div
            id="bufferSetting"
            class="buffer-setting"
          >

            累積

            <input
              id="bufferSize"
              type="number"
              min="10"
              max="1000"
              step="10"
              value="80"
            >

            個字後翻譯

          </div>

        </div>


        <!-- 控制按鈕 -->

        <div class="controls">

          <button
            id="startButton"
            class="start-button"
          >
            🎤 開始翻譯
          </button>


          <button
            id="stopButton"
            class="stop-button"
            disabled
          >
            ⏹ 停止
          </button>

        </div>


        <!-- 錄音時間 -->

        <div class="timer">

          錄音時間：

          <span id="timer">
            00:00
          </span>

        </div>


        <!-- 即時辨識 -->

        <section class="panel">

          <div class="panel-label">
            即時辨識
          </div>

          <div
            id="interimText"
            class="interim-text"
          >
            等待英文語音...
          </div>

        </section>


        <!-- 英文逐字稿 -->

        <section class="panel">

          <div class="panel-label">
            英文逐字稿
          </div>

          <div
            id="englishText"
            class="english-text"
          >
            尚無內容
          </div>

        </section>


        <!-- 中文翻譯 -->

        <section class="panel">

          <div class="panel-label">
            中文翻譯
          </div>

          <div
            id="chineseText"
            class="chinese-text"
          >
            尚無內容
          </div>

        </section>


        <!-- 翻譯紀錄 -->

        <section class="transcript-section">

          <h2>
            翻譯紀錄
          </h2>

          <div
            id="transcript"
            class="transcript"
          >
          </div>

        </section>


      </section>


      <!-- 其他工具 -->

      <section
        id="futureTools"
        class="future-tools"
        style="display:none;"
      >

        <h2>
          其他工具
        </h2>


        <div class="tool-grid">


          <div class="future-card">

            📝

            <span>
              歷史逐字稿
            </span>

          </div>


          <div class="future-card">

            🔧

            <span>
              未來功能
            </span>

          </div>


        </div>

      </section>


    </main>

  </div>


  <script src="app.js"></script>

</body>

</html>
